<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Modern and professional shopping cart page">
    <title>Trisher | cart</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- Bootstrap -->
    <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="assets/css/all.min.css">
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="assets/css/style.css">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
        }
        .cart-table {
            background: #fff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }
        .cart-table th, .cart-table td {
            padding: 15px;
            text-align: center;
            vertical-align: middle;
        }
        .product-image img {
            max-width: 70px;
            border-radius: 5px;
        }
        .cart-buttons .btn {
            width: 100%;
            font-weight: 600;
            padding: 12px;
            border-radius: 5px;
        }
        .total-section {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-lg-8">
                <div class="cart-table">
                    <table class="table">
                        <thead class="bg-primary text-white">
                            <tr>
                                <th>Remove</th>
                                <th>Product</th>
                                <th>Name</th>
                                <th>Price</th>
                                <th>Quantity</th>
                                <th>Total</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td><a href="#" class="text-danger"><i class="far fa-trash-alt"></i></a></td>
                                <td class="product-image"><img src="assets/img/products/product-img-1.jpg" alt=""></td>
                                <td>Artificial Leather Shoes</td>
                                <td>K350</td>
                                <td><input type="number" class="form-control" value="1" min="1"></td>
                                <td>$85</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="col-lg-4">
                <div class="total-section">
                    <h5>Cart Summary</h5>
                    <hr>
                    <p><strong>Subtotal:</strong> K85</p>
                    <p><strong>Delivery:</strong> K5</p>
                    <h4><strong>Total:</strong> K90</h4>
                    <div class="cart-buttons mt-3">
                        <a href="checkout.html" class="btn btn-primary">Proceed to payment</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="assets/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
