<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register | Trisher Looks</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container py-5">
    <h2 class="text-center mb-4">Create Your Account</h2>
    <form action="register.php" method="POST" class="border p-4 bg-light rounded">
        <!-- Basic Details -->
        <h4 class="mb-3">1. Applicant’s Basic Details</h4>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label>First Name</label>
                <input type="text" name="firstName" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
                <label>Last Name</label>
                <input type="text" name="lastName" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
                <label>NRC</label>
                <input type="text" name="nrc" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
                <label>Date of Birth</label>
                <input type="date" name="dob" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
                <label>Phone Number</label>
                <input type="tel" name="phone" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
                <label>Email Address</label>
                <input type="email" name="email" class="form-control" required>
            </div>
        </div>

        <h5 class="mt-4">Residential Address</h5>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label>Physical Address</label>
                <input type="text" name="physicalAddress" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
                <label>Area</label>
                <input type="text" name="area" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
                <label>Street</label>
                <input type="text" name="street" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
                <label>Town</label>
                <input type="text" name="town" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
                <label>Province</label>
                <input type="text" name="province" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
                <label>Country</label>
                <input type="text" name="country" class="form-control" required>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label>Sex</label>
                <select name="sex" class="form-control" required>
                    <option value="">Select</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>
            </div>
            <div class="col-md-6 mb-3">
                <label>Type of Client</label>
                <select name="clientType" class="form-control" required>
                    <option value="">Select</option>
                    <option>Student</option>
                    <option>Worker</option>
                    <option>Business Person</option>
                </select>
            </div>
        </div>

        <div class="mb-3">
            <label>Hobbies</label>
            <input type="text" name="hobbies" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Create Password</label>
            <input type="password" name="password" class="form-control" required>
        </div>

        <!-- Bank Details -->
        <h4 class="mt-5">2. Bank Details</h4>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label>Name of Bank</label>
                <input type="text" name="bankName" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
                <label>Bank Account No</label>
                <input type="text" name="bankAccount" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
                <label>Branch of Bank</label>
                <input type="text" name="bankBranch" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
                <label>Address of Bank</label>
                <input type="text" name="bankAddress" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
                <label>Bank Phone Number</label>
                <input type="tel" name="bankPhone" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
                <label>Bank Email</label>
                <input type="email" name="bankEmail" class="form-control" required>
            </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 mt-3">Register</button>
    </form>
</div>
</body>
</html>
